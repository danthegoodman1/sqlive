[workspace]
resolver = "3"
members = ["crates/bench", "crates/live", "crates/node", "crates/sim", "examples/chat"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/danthegoodman1/sqlive"

[workspace.dependencies]
blake3 = "1.8.7"
rusqlite = { version = "0.41", features = ["bundled", "hooks", "preupdate_hook", "column_metadata"] }
sqlite3-parser = { version = "0.17", default-features = false }
sqlive = { path = "crates/live" }

[profile.release]
debug = 1

# The Node addon ships stripped, with link-time optimization across SqLive,
# rusqlite and napi-rs.
[profile.node]
inherits = "release"
debug = false
strip = "symbols"
lto = "fat"
codegen-units = 1
